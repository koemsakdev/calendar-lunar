<ion-tabs #tabs>
  <!-- Hide the native tab bar completely -->
  <ion-tab-bar slot="bottom" style="display:none"></ion-tab-bar>
</ion-tabs>

<!-- Custom floating nav sits outside ion-tabs -->
<div class="floating-nav">
  <div class="glass-pill">
    <div
      class="nav-item"
      [class.active]="activeTab === 'tab1'"
      (click)="switchTab('tab1')"
    >
      <div class="indicator"></div>
      <div class="icon-box">
        <ion-icon name="calendar-outline"></ion-icon>
      </div>
      <span class="label">ប្រតិទិន</span>
    </div>

    <div
      class="nav-item"
      [class.active]="activeTab === 'tab2'"
      (click)="switchTab('tab2')"
    >
      <div class="indicator"></div>
      <div class="icon-box">
        <ion-icon name="list-outline"></ion-icon>
      </div>
      <span class="label">ព្រឹត្តិការណ៍</span>
    </div>

    <div
      class="nav-item"
      [class.active]="activeTab === 'tab3'"
      (click)="switchTab('tab3')"
    >
      <div class="indicator"></div>
      <div class="icon-box">
        <ion-icon name="alarm-outline"></ion-icon>
      </div>
      <span class="label">ការរំលឹក</span>
    </div>
  </div>
</div>
